# yaml-language-server: $schema=../../../../go/sdl/sdl-input.schema.yaml
---
version: "2.2"
volumes:
  myapp-pgdata:
    size: 10Gi
    class: beta2
    lifecycle:
      # Accepted by Go's time.ParseDuration (compound, 90m > 0) but rejected
      # by the stricter schema pattern (^[1-9][0-9]*(s|m|h)$). Schema-only-
      # invalid: schema rejects, Go parser accepts.
      retention: "1h30m"
profiles:
  placement:
    us-west:
      pricing:
        myapp-pgdata:
          denom: uakt
          amount: 150
deployment:
  myapp-pgdata:
    us-west:
      profile: myapp-pgdata
      count: 1
