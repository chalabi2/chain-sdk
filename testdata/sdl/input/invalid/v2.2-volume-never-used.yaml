# yaml-language-server: $schema=../../../../go/sdl/sdl-input.schema.yaml
---
version: "2.2"
# Referenced by no service; like endpoints, unused volumes are rejected.
volumes:
  unused-data:
    external:
      owner: akash1qufa3xzrf34qvwyejkhvnc4psf49fftaw0asmh
      dseq: 42
services:
  web:
    image: nginx
    expose:
      - port: 80
        to:
          - global: true
profiles:
  compute:
    web:
      resources:
        cpu:
          units: 1
        memory:
          size: 128Mi
        storage:
          size: 512Mi
  placement:
    westcoast:
      pricing:
        web:
          denom: uakt
          amount: 50
deployment:
  web:
    westcoast:
      profile: web
      count: 1
