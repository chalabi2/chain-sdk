# yaml-language-server: $schema=../../../../go/sdl/sdl-input.schema.yaml
---
version: "2.2"
# The reference names no owner, and the fixture is parsed without one
# (Go's sdl.WithOwner, the TS owner option), so it cannot compile to a
# VolumeRef.
volumes:
  myapp-pgdata:
    external:
      dseq: 1234567
services:
  db:
    image: postgres:16
    expose:
      - port: 5432
        to:
          - global: true
    params:
      storage:
        data:
          mount: /var/lib/postgresql/data
          volume: myapp-pgdata
profiles:
  compute:
    db:
      resources:
        cpu:
          units: 2
        memory:
          size: 4Gi
        storage: []
  placement:
    anywhere:
      pricing:
        db:
          denom: uakt
          amount: 800
deployment:
  db:
    anywhere:
      profile: db
      count: 1
