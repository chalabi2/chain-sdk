# yaml-language-server: $schema=../../../../go/sdl/sdl-input.schema.yaml
---
version: "2.2"
volumes:
  myapp-pgdata:
    external:
      owner: akash1qufa3xzrf34qvwyejkhvnc4psf49fftaw0asmh
      dseq: 1234567
services:
  db:
    image: postgres:16
    expose:
      - port: 5432
        to:
          - global: true
    # A volume reference requires a mount.
    params:
      storage:
        data:
          volume: myapp-pgdata
profiles:
  compute:
    db:
      resources:
        cpu:
          units: 2
        memory:
          size: 4Gi
        storage: []
  placement:
    anywhere:
      pricing:
        db:
          denom: uakt
          amount: 800
deployment:
  db:
    anywhere:
      profile: db
      count: 1
