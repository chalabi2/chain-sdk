# yaml-language-server: $schema=../../../../go/sdl/sdl-input.schema.yaml
---
version: "2.2"
services:
  db:
    image: postgres:16
    expose:
      - port: 5432
        to:
          - global: true
    # Mounts a volume the volumes stanza does not declare.
    params:
      storage:
        data:
          mount: /var/lib/postgresql/data
          volume: myapp-pgdata
profiles:
  compute:
    db:
      resources:
        cpu:
          units: 2
        memory:
          size: 4Gi
        storage: []
  placement:
    anywhere:
      pricing:
        db:
          denom: uakt
          amount: 800
deployment:
  db:
    anywhere:
      profile: db
      count: 1
