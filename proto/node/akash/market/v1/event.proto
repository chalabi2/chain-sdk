syntax = "proto3";
package akash.market.v1;

import "gogoproto/gogo.proto";

import "cosmos/base/v1beta1/coin.proto";

import "akash/deployment/v1/volume.proto";

import "akash/market/v1/bid.proto";
import "akash/market/v1/order.proto";
import "akash/market/v1/lease.proto";
import "akash/market/v1/types.proto";

option go_package = "pkg.akt.dev/go/node/market/v1";

// EventOrderCreated is triggered when an order is created.
// It contains all the information required to identify an order.
message EventOrderCreated {
  option (gogoproto.equal) = true;

  // Id is the unique identifier of the Order.
  OrderID id = 1 [
    (gogoproto.nullable)   = false,
    (gogoproto.customname) = "ID",
    (gogoproto.jsontag)    = "id",
    (gogoproto.moretags)   = "yaml:\"id\""
  ];
}

// EventOrderClosed is triggered when an order is closed.
// It contains all the information required to identify an order.
message EventOrderClosed {
  option (gogoproto.equal) = true;

  // Id is the unique identifier of the Order.
  OrderID id = 1 [
    (gogoproto.nullable)   = false,
    (gogoproto.customname) = "ID",
    (gogoproto.jsontag)    = "id",
    (gogoproto.moretags)   = "yaml:\"id\""
  ];
}

// EventBidCreated is triggered when a bid is created.
// It contains all the information required to identify a bid.
message EventBidCreated {
  option (gogoproto.equal) = true;

  // Id is the unique identifier of the Bid.
  BidID id = 1 [
    (gogoproto.nullable)   = false,
    (gogoproto.customname) = "ID",
    (gogoproto.jsontag)    = "id",
    (gogoproto.moretags)   = "yaml:\"id\""
  ];

  // Price stated on the Bid.
  cosmos.base.v1beta1.DecCoin price = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag)  = "price",
    (gogoproto.moretags) = "yaml:\"price\""
  ];
}

// EventBidClosed is triggered when a bid is closed.
// It contains all the information required to identify a bid.
message EventBidClosed {
  option (gogoproto.equal) = true;

  // Id is the unique identifier of the Bid.
  BidID id = 1 [
    (gogoproto.nullable)   = false,
    (gogoproto.customname) = "ID",
    (gogoproto.jsontag)    = "id",
    (gogoproto.moretags)   = "yaml:\"id\""
  ];
}

// EventLeaseCreated is triggered when a lease is created.
// It contains all the information required to identify a lease.
message EventLeaseCreated {
  option (gogoproto.equal) = true;

  // Id is the unique identifier of the Lease.
  LeaseID id = 1 [
    (gogoproto.nullable)   = false,
    (gogoproto.customname) = "ID",
    (gogoproto.jsontag)    = "id",
    (gogoproto.moretags)   = "yaml:\"id\""
  ];

  // Price settled for the lease.
  cosmos.base.v1beta1.DecCoin price = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag)  = "price",
    (gogoproto.moretags) = "yaml:\"price\""
  ];
}

// EventLeaseClosed is triggered when a lease is closed.
// It contains all the information required to identify a lease.
message EventLeaseClosed {
  option (gogoproto.equal) = true;

  // Id is the unique identifier of the Lease.
  LeaseID id = 1 [
    (gogoproto.nullable)   = false,
    (gogoproto.customname) = "ID",
    (gogoproto.jsontag)    = "id",
    (gogoproto.moretags)   = "yaml:\"id\""
  ];

  LeaseClosedReason reason = 2 [
    (gogoproto.jsontag)  = "reason",
    (gogoproto.moretags) = "yaml:\"reason\""
  ];
}

// EventLeaseReclaimStarted is triggered when a provider initiates reclamation on a lease.
message EventLeaseReclaimStarted {
  option (gogoproto.equal) = true;

  // Id is the unique identifier of the Lease.
  LeaseID id = 1 [
    (gogoproto.nullable)   = false,
    (gogoproto.customname) = "ID",
    (gogoproto.jsontag)    = "id",
    (gogoproto.moretags)   = "yaml:\"id\""
  ];

  // reason is the provider's stated reason for reclamation.
  LeaseClosedReason reason = 2 [
    (gogoproto.jsontag)  = "reason",
    (gogoproto.moretags) = "yaml:\"reason\""
  ];

  // deadline is the unix timestamp when the reclamation window expires.
  int64 deadline = 3 [
    (gogoproto.jsontag)  = "deadline",
    (gogoproto.moretags) = "yaml:\"deadline\""
  ];
}


// EventVolumeAttached is triggered when a compute lease attaches an
// externally-leased volume.
message EventVolumeAttached {
  option (gogoproto.equal) = true;

  // LeaseId is the unique identifier of the compute lease.
  LeaseID lease_id = 1 [
    (gogoproto.nullable)   = false,
    (gogoproto.customname) = "LeaseID",
    (gogoproto.jsontag)    = "lease_id",
    (gogoproto.moretags)   = "yaml:\"lease_id\""
  ];

  // Volume references the attached volume.
  akash.deployment.v1.VolumeRef volume = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag)  = "volume",
    (gogoproto.moretags) = "yaml:\"volume\""
  ];
}

// EventVolumeDetached is triggered when a compute lease detaches from an
// externally-leased volume, on any close path.
message EventVolumeDetached {
  option (gogoproto.equal) = true;

  // LeaseId is the unique identifier of the compute lease.
  LeaseID lease_id = 1 [
    (gogoproto.nullable)   = false,
    (gogoproto.customname) = "LeaseID",
    (gogoproto.jsontag)    = "lease_id",
    (gogoproto.moretags)   = "yaml:\"lease_id\""
  ];

  // Volume references the detached volume.
  akash.deployment.v1.VolumeRef volume = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag)  = "volume",
    (gogoproto.moretags) = "yaml:\"volume\""
  ];

  // Reason is why the detach happened.
  LeaseClosedReason reason = 3 [
    (gogoproto.jsontag)  = "reason",
    (gogoproto.moretags) = "yaml:\"reason\""
  ];
}
