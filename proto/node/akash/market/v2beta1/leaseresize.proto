syntax = "proto3";
package akash.market.v2beta1;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";

import "akash/deployment/v1beta5/resourceunit.proto";
import "akash/market/v1/lease.proto";

option go_package = "pkg.akt.dev/go/node/market/v2beta1";

// LeaseResize is a tenant's pending request to change the resources of an
// active lease in place. The lease's provider applies it with
// MsgAcceptLeaseResize; a reject, a cancel, the lease closing or expiry drop
// it. A deployment has at most one pending resize, because the manifest hash
// it carries covers every group of the deployment.
message LeaseResize {
  option (gogoproto.equal) = false;

  // LeaseId identifies the lease to resize.
  akash.market.v1.LeaseID lease_id = 1 [
    (gogoproto.nullable)   = false,
    (gogoproto.customname) = "LeaseID",
    (gogoproto.jsontag)    = "lease_id",
    (gogoproto.moretags)   = "yaml:\"lease_id\""
  ];

  // Resources is the complete new resource unit list for the lease's group.
  repeated akash.deployment.v1beta5.ResourceUnit resources = 2 [
    (gogoproto.nullable)     = false,
    (gogoproto.castrepeated) = "pkg.akt.dev/go/node/deployment/v1beta5.ResourceUnits",
    (gogoproto.jsontag)      = "resources",
    (gogoproto.moretags)     = "yaml:\"resources\""
  ];

  // Hash is the manifest version the deployment switches to when the resize
  // is accepted. It is empty for volume groups, whose size is not part of the
  // manifest.
  bytes hash = 3 [
    (gogoproto.jsontag)  = "hash",
    (gogoproto.moretags) = "yaml:\"hash\""
  ];

  // MaxPrice is the highest per-block price the provider may accept: the sum
  // of price times count over Resources.
  cosmos.base.v1beta1.DecCoin max_price = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag)  = "max_price",
    (gogoproto.moretags) = "yaml:\"max_price\""
  ];

  // RequestedAt is the block height of the request.
  int64 requested_at = 5 [
    (gogoproto.jsontag)  = "requested_at",
    (gogoproto.moretags) = "yaml:\"requested_at\""
  ];

  // ExpiresAt is the unix timestamp after which the request can no longer be
  // accepted.
  int64 expires_at = 6 [
    (gogoproto.jsontag)  = "expires_at",
    (gogoproto.moretags) = "yaml:\"expires_at\""
  ];

  // Digest identifies the request: the SHA-256 of its encoding with the
  // digest left empty, set by the chain when the request is made. A
  // provider's accept or reject names it, so an answer can only apply to the
  // request it was decided on, never to one that replaced it.
  bytes digest = 7 [
    (gogoproto.jsontag)  = "digest",
    (gogoproto.moretags) = "yaml:\"digest\""
  ];
}
