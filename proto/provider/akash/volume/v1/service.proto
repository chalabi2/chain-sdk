syntax = "proto3";
package akash.volume.v1;

import "google/api/annotations.proto";
import "gogoproto/gogo.proto";

option go_package = "pkg.akt.dev/go/volume/v1";

// ExportRequest asks the exporting provider for a volume image stream.
// Authorization is derived from chain state on both ends: the requester must
// be the destination provider of a live migration/replication for the named
// volume, and it must match the mTLS client certificate (x/cert identity).
message ExportRequest {
  // owner is the account bech32 address of the volume owner.
  string owner = 1 [
    (gogoproto.jsontag)  = "owner",
    (gogoproto.moretags) = "yaml:\"owner\""
  ];

  // vid is the tenant-chosen data-continuity label of the volume.
  string vid = 2 [
    (gogoproto.jsontag)  = "vid",
    (gogoproto.moretags) = "yaml:\"vid\""
  ];

  // dseq is the volume deployment on the EXPORTER's side.
  uint64 dseq = 3 [
    (gogoproto.customname) = "DSeq",
    (gogoproto.jsontag)    = "dseq",
    (gogoproto.moretags)   = "yaml:\"dseq\""
  ];

  // requester is the destination provider address; it must match the mTLS
  // client certificate presented on the connection.
  string requester = 4 [
    (gogoproto.jsontag)  = "requester",
    (gogoproto.moretags) = "yaml:\"requester\""
  ];

  // from_snapshot is the diff base snapshot id. Empty requests a full
  // export; non-empty requests an incremental diff (resumable).
  string from_snapshot = 5 [
    (gogoproto.jsontag)  = "from_snapshot",
    (gogoproto.moretags) = "yaml:\"from_snapshot\""
  ];

  // resume_offset is the byte offset to resume a previously interrupted
  // export stream from.
  uint64 resume_offset = 6 [
    (gogoproto.jsontag)  = "resume_offset",
    (gogoproto.moretags) = "yaml:\"resume_offset\""
  ];
}

// ExportChunk is one verifiable chunk of the exported volume image stream.
message ExportChunk {
  // data is the raw image bytes of this chunk.
  bytes data = 1 [
    (gogoproto.jsontag)  = "data",
    (gogoproto.moretags) = "yaml:\"data\""
  ];

  // sha256 is the digest of this chunk's data.
  bytes sha256 = 2 [
    (gogoproto.customname) = "SHA256",
    (gogoproto.jsontag)    = "sha256",
    (gogoproto.moretags)   = "yaml:\"sha256\""
  ];

  // offset is the byte offset of this chunk within the export stream.
  uint64 offset = 3 [
    (gogoproto.jsontag)  = "offset",
    (gogoproto.moretags) = "yaml:\"offset\""
  ];
}

// StatusRequest queries the exporting provider for the transfer state of a
// volume. Authorization mirrors ExportRequest.
message StatusRequest {
  // owner is the account bech32 address of the volume owner.
  string owner = 1 [
    (gogoproto.jsontag)  = "owner",
    (gogoproto.moretags) = "yaml:\"owner\""
  ];

  // vid is the tenant-chosen data-continuity label of the volume.
  string vid = 2 [
    (gogoproto.jsontag)  = "vid",
    (gogoproto.moretags) = "yaml:\"vid\""
  ];

  // dseq is the volume deployment on the EXPORTER's side.
  uint64 dseq = 3 [
    (gogoproto.customname) = "DSeq",
    (gogoproto.jsontag)    = "dseq",
    (gogoproto.moretags)   = "yaml:\"dseq\""
  ];

  // requester is the destination provider address; it must match the mTLS
  // client certificate presented on the connection.
  string requester = 4 [
    (gogoproto.jsontag)  = "requester",
    (gogoproto.moretags) = "yaml:\"requester\""
  ];
}

// StatusResponse reports sync lag, held snapshots, and the whole-image
// digest so the importer can verify a completed transfer.
message StatusResponse {
  // snapshots lists the snapshot ids held for this volume, oldest first.
  // Any of them may serve as a diff base for an incremental export.
  repeated string snapshots = 1 [
    (gogoproto.jsontag)  = "snapshots",
    (gogoproto.moretags) = "yaml:\"snapshots\""
  ];

  // latest_snapshot is the most recent snapshot id.
  string latest_snapshot = 2 [
    (gogoproto.jsontag)  = "latest_snapshot",
    (gogoproto.moretags) = "yaml:\"latest_snapshot\""
  ];

  // size is the size in bytes of the full image at the latest snapshot.
  uint64 size = 3 [
    (gogoproto.jsontag)  = "size",
    (gogoproto.moretags) = "yaml:\"size\""
  ];

  // sha256 is the whole-image digest at the latest snapshot.
  bytes sha256 = 4 [
    (gogoproto.customname) = "SHA256",
    (gogoproto.jsontag)    = "sha256",
    (gogoproto.moretags)   = "yaml:\"sha256\""
  ];

  // sync_lag_seconds is the age of the latest snapshot relative to the
  // live volume: how far behind a destination syncing from it would be.
  int64 sync_lag_seconds = 5 [
    (gogoproto.jsontag)  = "sync_lag_seconds",
    (gogoproto.moretags) = "yaml:\"sync_lag_seconds\""
  ];

  // final reports that latest_snapshot was taken after the volume's lease
  // closed and the last workload using it stopped: no write can follow it, so
  // a destination holding that snapshot holds the whole volume. A migration
  // completes only on a final snapshot.
  bool final = 6 [
    (gogoproto.jsontag)  = "final,omitempty",
    (gogoproto.moretags) = "yaml:\"final,omitempty\""
  ];
}

// ExportObjectsRequest asks the exporting provider for the objects of a
// bucket that moves to the requester. Authorization mirrors ExportRequest.
message ExportObjectsRequest {
  // owner is the account bech32 address of the bucket owner.
  string owner = 1 [
    (gogoproto.jsontag)  = "owner",
    (gogoproto.moretags) = "yaml:\"owner\""
  ];

  // vid is the tenant-chosen data-continuity label of the bucket.
  string vid = 2 [
    (gogoproto.jsontag)  = "vid",
    (gogoproto.moretags) = "yaml:\"vid\""
  ];

  // dseq is the bucket's deployment on the EXPORTER's side.
  uint64 dseq = 3 [
    (gogoproto.customname) = "DSeq",
    (gogoproto.jsontag)    = "dseq",
    (gogoproto.moretags)   = "yaml:\"dseq\""
  ];

  // requester is the destination provider address; it must match the mTLS
  // client certificate presented on the connection.
  string requester = 4 [
    (gogoproto.jsontag)  = "requester",
    (gogoproto.moretags) = "yaml:\"requester\""
  ];

  // start_after resumes an interrupted export: objects stream in key order,
  // so the stream starts with the first object whose key sorts after it.
  // Empty starts with the bucket's first object.
  string start_after = 5 [
    (gogoproto.jsontag)  = "start_after",
    (gogoproto.moretags) = "yaml:\"start_after\""
  ];
}

// ObjectAttributes are what an object is served with besides its content.
message ObjectAttributes {
  // size is the object's length in bytes.
  uint64 size = 1 [
    (gogoproto.jsontag)  = "size",
    (gogoproto.moretags) = "yaml:\"size\""
  ];

  string content_type = 2 [
    (gogoproto.jsontag)  = "content_type,omitempty",
    (gogoproto.moretags) = "yaml:\"content_type,omitempty\""
  ];

  string content_encoding = 3 [
    (gogoproto.jsontag)  = "content_encoding,omitempty",
    (gogoproto.moretags) = "yaml:\"content_encoding,omitempty\""
  ];

  string content_disposition = 4 [
    (gogoproto.jsontag)  = "content_disposition,omitempty",
    (gogoproto.moretags) = "yaml:\"content_disposition,omitempty\""
  ];

  string content_language = 5 [
    (gogoproto.jsontag)  = "content_language,omitempty",
    (gogoproto.moretags) = "yaml:\"content_language,omitempty\""
  ];

  string cache_control = 6 [
    (gogoproto.jsontag)  = "cache_control,omitempty",
    (gogoproto.moretags) = "yaml:\"cache_control,omitempty\""
  ];

  // expires is the object's Expires header, as the S3 server serves it.
  string expires = 7 [
    (gogoproto.jsontag)  = "expires,omitempty",
    (gogoproto.moretags) = "yaml:\"expires,omitempty\""
  ];

  // metadata is the object's user metadata (x-amz-meta-*), keyed by the
  // lower-case name without the prefix.
  map<string, string> metadata = 8 [
    (gogoproto.jsontag)  = "metadata,omitempty",
    (gogoproto.moretags) = "yaml:\"metadata,omitempty\""
  ];
}

// ObjectChunk is one piece of a bucket's export stream. Objects stream whole,
// one after another in key order. An object's first chunk is at offset 0 and
// carries its attributes; its last chunk carries the sha256 of the whole
// object, which the destination checks before keeping it.
message ObjectChunk {
  // key is the key of the object the chunk belongs to.
  string key = 1 [
    (gogoproto.jsontag)  = "key",
    (gogoproto.moretags) = "yaml:\"key\""
  ];

  // attributes describe the object; set on its first chunk only.
  ObjectAttributes attributes = 2 [
    (gogoproto.jsontag)  = "attributes,omitempty",
    (gogoproto.moretags) = "yaml:\"attributes,omitempty\""
  ];

  // offset is where data starts within the object.
  uint64 offset = 3 [
    (gogoproto.jsontag)  = "offset",
    (gogoproto.moretags) = "yaml:\"offset\""
  ];

  // data is a piece of the object's content.
  bytes data = 4 [
    (gogoproto.jsontag)  = "data",
    (gogoproto.moretags) = "yaml:\"data\""
  ];

  // sha256 is the digest of data.
  bytes sha256 = 5 [
    (gogoproto.customname) = "SHA256",
    (gogoproto.jsontag)    = "sha256",
    (gogoproto.moretags)   = "yaml:\"sha256\""
  ];

  // object_sha256 is the digest of the whole object; set on its last chunk
  // only, which ends the object.
  bytes object_sha256 = 6 [
    (gogoproto.customname) = "ObjectSHA256",
    (gogoproto.jsontag)    = "object_sha256,omitempty",
    (gogoproto.moretags)   = "yaml:\"object_sha256,omitempty\""
  ];
}

// VolumeTransfer is the off-chain volume data plane, served by the storage
// operator on the provider gateway. Both directions authenticate with mTLS
// against on-chain provider identities (x/cert); authorization is derived
// from chain state on both ends.
service VolumeTransfer {
  // Export streams the volume image, full or as a diff from a snapshot.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Export(ExportRequest) returns (stream ExportChunk);

  // ExportObjects streams every object of a bucket moving to the requester.
  // The exporter serves it only once the bucket is final: its lease closed and
  // no key can write to it any more.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc ExportObjects(ExportObjectsRequest) returns (stream ObjectChunk);

  // Status reports sync lag, snapshots held, and image digests.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc Status(StatusRequest) returns (StatusResponse) {
    option (google.api.http) = {
      get: "/v1/volume/status",
      response_body: "*"
    };
  }
}
